# Gera o build com Vite e publica no GitHub Pages a cada push na branch main.
# Enquanto não existir index.html na raiz, o deploy é pulado (o código só fica salvo no repositório).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          if [ -f index.html ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::index.html ainda não existe - deploy pulado."
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - if: steps.check.outputs.ready == 'true'
        run: npm ci

      - if: steps.check.outputs.ready == 'true'
        run: npm run build

      - if: steps.check.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
