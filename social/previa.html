<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teewald · prévia do Instagram</title>
<!-- Prévia da campanha (abra no navegador): o perfil depois da semana 5, como o Instagram
     mostra (fixados no alto, os mais novos primeiro, miniaturas em 3:4), os stories e o
     reels. As peças são as desta pasta; o plano está em CAMPANHA.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600&family=Spectral:ital,wght@0,400;0,600;1,400&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site/css/site.css">
<style>
  body::before { display: none; }
  .previa { max-width: 960px; margin: 0 auto; padding: 32px 16px 80px; }
  .perfil { display: flex; gap: 28px; align-items: center; margin-bottom: 28px; }
  .perfil img { width: 120px; height: 120px; border-radius: 50%; flex: none; }
  .perfil h1 { font-size: 2.6rem; margin: 0; }
  .perfil p { margin: 6px 0 0; color: var(--cor-texto-suave); max-width: 34em; }
  .grade { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .grade a { position: relative; display: block; aspect-ratio: 3 / 4; overflow: hidden; background: #000; }
  .grade img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .grade a:hover img { transform: scale(1.03); }
  .grade span { position: absolute; top: 8px; right: 8px; font: 1.1rem / 1 var(--fonte-ui); letter-spacing: .08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px #000; }
  h2 { font-size: 2rem; margin: 48px 0 16px; }
  .fila { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .fila img, .fila video { width: 200px; aspect-ratio: 9 / 16; object-fit: cover; flex: none; border-radius: 8px; background: #000; }
  .nota { color: var(--cor-texto-fraco); font-size: .95rem; }
  @media (max-width: 560px) { .perfil { flex-direction: column; text-align: center; } }
</style>
</head>
<body>
<main class="previa">
  <div class="perfil">
    <img src="perfil.jpg" alt="">
    <div>
      <h1>Teewald</h1>
      <p>Survival horror com cara de PS1 numa cidade gaúcha de verdade. Maio de 1997. Alguma coisa anda no mato. ▶ Grátis no navegador</p>
    </div>
  </div>
  <div class="grade" id="grade"></div>
  <p class="nota">O perfil no fim da semana 5. Clique numa miniatura para ver a imagem inteira.</p>

  <h2>Stories</h2>
  <div class="fila" id="stories"></div>

  <h2>Reels</h2>
  <div class="fila">
    <video src="reels/teewald-reels.mp4" poster="reels/capa.jpg" controls playsinline></video>
    <img src="reels/capa.jpg" alt="Capa do reels">
  </div>
</main>
<script>
  // ordem de publicação (CAMPANHA.md); o perfil mostra os fixados e depois os mais novos
  const pub = [
    ['posts/01-capa.jpg'], ['reels/capa.jpg', 'reels'], ['posts/02-cidade-1.jpg', 'carrossel'],
    ['posts/03-jornal.jpg'], ['posts/04-forasteiro.jpg'], ['posts/05-cartaz.jpg'],
    ['posts/06-estilo-1.jpg', 'carrossel'], ['posts/07-praca-noite.jpg'], ['posts/08-moradores-1.jpg', 'carrossel'],
    ['posts/09-arno.jpg'], ['posts/10-jogo-1.jpg', 'carrossel'], ['posts/11-lua.jpg'],
    ['posts/12-celular.jpg'], ['posts/13-pegadas.jpg'], ['posts/14-tempestade.jpg'],
    ['posts/15-kartoffelfest.jpg'], ['posts/16-carro.jpg'],
  ];
  const fixados = [pub[1], pub[0], pub[2]];
  const resto = pub.filter(p => !fixados.includes(p)).reverse();
  document.getElementById('grade').innerHTML = [...fixados.map(p => [...p, 'fixado']), ...resto]
    .map(([src, tipo, fix]) => `<a href="${src}"><img src="${src}" alt="" loading="lazy"><span>${[fix, tipo].filter(Boolean).join(' · ')}</span></a>`).join('');
  document.getElementById('stories').innerHTML = ['01-chegou', '02-enquete', '03-jornal', '04-estilo', '05-hoje']
    .map(n => `<a href="stories/${n}.jpg"><img src="stories/${n}.jpg" alt="" loading="lazy"></a>`).join('');
</script>
</body>
</html>
